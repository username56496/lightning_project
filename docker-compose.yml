services:
  web:
    image: nginx:latest
    container_name: lightning_web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/html:/usr/share/nginx/html  # 이 줄을 추가했습니다!
    depends_on:
      - api

  api:
    build: ./flask_app
    container_name: lightning_api
    ports:
      - "5000:5000"