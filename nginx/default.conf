server {
    listen 80;

    # 기본 접속 화면 (나중에 HTML 파일을 넣을 자리)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # /api/로 시작하는 요청은 Flask(api 서비스)로 전달
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}